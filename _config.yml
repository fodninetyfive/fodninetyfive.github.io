permalink: /:year:month:day/:title
url: "https://fodninetyfive.github.io/" #Your url here
baseurl: ""

# variables
name: "(C:) Drive"
title: "(C:) Drive"
description: files in folders
google_verification: null


# File management
include: [".htaccess"]
exclude: ["README.md", "LICENSE"]

# Sass
sass:
  style: :compressed
  sass_dir: _sass

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable : true

collections:
  tags:
    output: true
    permalink: /tags/:name/

# Front matter defaults - auto-set layout and tags based on path
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: default
  - scope:
      path: "_posts/mydocuments/ruminations"
    values:
      tags: ruminations
  - scope:
      path: "_posts/mydocuments/yellowcarding"
    values:
      tags: yellowcarding
  - scope:
      path: "_posts/myprojects/creative"
    values:
      tags: creative
  - scope:
      path: "_posts/mymusic/bootlegs"
    values:
      tags: bootlegs